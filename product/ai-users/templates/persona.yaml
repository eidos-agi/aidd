id: operator
name: Promotion operator
job: Decide whether a challenger becomes the next champion.
goals:
  - Read the frozen eval bundle and hard-gate results
  - Promote only on evidence
  - Record the decision
failure_modes:
  - Promotes on architecture taste
  - Lets a failed gate through because the average looks good
  - Skips human sign-off
acceptance:
  - Every promotion cites the frozen eval bundle, hard-gate results, and a signed decision
  - Ties stay with the champion
