name: agent-run-completed
version: 2
owner: orchestration
key:
  fields: [tenant_id, run_id]
schema:
  tenant_id: { type: uuid, required: true }
  run_id: { type: uuid, required: true }
  status:
    type: enum
    values: [succeeded, failed, canceled, timed_out]
    required: true
  started_at: { type: timestamp, required: true }
  completed_at: { type: timestamp, required: true }
  total_cost_usd: { type: decimal, minimum: 0 }
  tool_calls: { type: integer, minimum: 0 }
invariants:
  - "completed_at >= started_at"
  - "status = 'succeeded' implies result_ref IS NOT NULL"
  - "run_id is unique within tenant_id"
  - "completed events are emitted at most once per run version"
  - "total_cost_usd equals sum(tool_invocation.cost_usd)"
privacy:
  classification: internal
  prohibited_fields:
    - raw_access_token
    - raw_cookie
    - unredacted_payment_data
freshness:
  max_ingestion_lag_seconds: 60
compatibility:
  backward: true
  breaking_change_requires:
    - new_event_version
    - consumer_migration
    - replay_validation
