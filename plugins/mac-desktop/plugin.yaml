id: mac-desktop
version: 0.1.0
kind: aidd-plugin
summary: Autonomous native Apple UI testing. Deterministic XCTest gates. Independent explorer and taste critic. Visual inspection as sensing.

extends:
  - product/frontend-testing-standards

surfaces:
  - macos
  - ios-simulator

machines:
  builder: Implements UI. Never grades itself.
  explorer: Drives the app. Discovers states. Minimizes traces.
  critic: Independent judge. Evidence in, verdict out.

oracle_rule: The builder does not approve its own UI.

hard_gates_file: gates/mechanical.yaml
product_invariants_file: gates/product-design.yaml
critic_file: gates/critic.yaml

candidate_may_not_edit:
  - gates/
  - critic/rubric.yaml
  - corpus/approved/
  - held-out baselines in plugin-evals/mac-desktop/

skills:
  - /aidd-mac

humans_still:
  - New interaction models
  - New component primitives
  - New product taste
  - Promotion
