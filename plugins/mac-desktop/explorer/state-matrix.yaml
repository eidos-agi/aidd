version: 1
# Great taste shows up in unsexy states.

axes:
  content: [empty, minimal, typical, maximum, malformed, long-strings]
  lifecycle: [first-run, loading, retry, refreshed, stale, completed]
  failure: [network, auth-expired, validation, server]
  device: [small-phone, large-phone, ipad, mac-window]
  system: [light, dark, dynamic-type, reduced-motion, voiceover-focus]
  locale: [primary, expansion-sensitive]
  account: [anonymous, new, returning, edge-permission]

entry:
  - deep links
  - launch arguments
  - seeded backend fixtures
  - feature flags
  # Not a fragile sequence of 22 taps.

rule: The explorer creates these states. The critic judges them. The suite keeps them.
