version: 1
tier: 2
enforcement: blocking-when-declared
model_required: optional

invariants:
  - id: one-primary-action
    requirement: "A transactional or task-completion screen has exactly one dominant primary action."
  - id: first-view-task
    requirement: "A screen's primary user task is identifiable in the first view."
  - id: color-not-alone
    requirement: "Every status color is paired with text, iconography, or another non-color cue."
  - id: alignment-grid
    requirement: "Repeated content follows one alignment grid. No arbitrary card-per-item unless the contract says so."
  - id: empty-means
    requirement: "An empty state says what the user is seeing, why, and what to do next."
  - id: error-near-field
    requirement: "A form reports errors near the field and preserves entered data."
  - id: primitive-registry
    requirement: "A new visual primitive uses an existing semantic component or registers a reason to become one."
  - id: copy-voice
    requirement: "Labels are concise. Verbs are specific. Destructive actions are unmistakable. Disallowed copy in the screen contract is absent."
