version: 1
surface: iphone

tools:
  - build_app(scheme, configuration)
  - boot_simulator(device, osVersion)   # iPhone SE, 16 Pro, 16 Pro Max
  - rotate(orientation)
  - set_content_size(category)
  - simulate_interruption(kind)         # banner, faceid, phone-call, app-switch
  - reset_app_data()
  - seed_backend(scenario)
  - set_feature_flags(flags)
  - launch_app(arguments, environment)
  - inspect_ui_tree()
  - tap(identifier)
  - type_text(identifier, value)
  - swipe_edge_back()
  - screenshot()
  - read_logs()
  - run_xctest(plan)
  - compare_snapshot(baseline)
  - create_github_issue_or_pr()

must_not:
  - treat an iPad destination as an iPhone pass
  - poke pixels or visible strings when an identifier exists

permissions:
  default:
    - edit test files
    - run build/test
    - extract xcresult
    - inspect screenshots and logs
    - open a PR of tests
  requires_approval:
    - modify production source
    - merge
    - change critic gates or baselines
