version: 1
surface: ipad

tools:
  - build_app(scheme, configuration)
  - boot_simulator(device, osVersion)    # iPad mini, Pro 11, Pro 13
  - set_split_view_ratio(ratio)          # 1/3, 1/2, 2/3
  - set_stage_manager_frame(size)
  - open_second_window()
  - attach_pointer()
  - attach_hardware_keyboard()
  - set_content_size(category)
  - reset_app_data()
  - seed_backend(scenario)
  - set_feature_flags(flags)
  - launch_app(arguments, environment)
  - inspect_ui_tree()
  - tap(identifier)
  - hover(identifier)
  - type_text(identifier, value)
  - keyboard_shortcut(keys)
  - drag(source, destination)
  - screenshot()
  - read_logs()
  - run_xctest(plan)
  - compare_snapshot(baseline)
  - create_github_issue_or_pr()

must_not:
  - treat an iPhone destination as an iPad pass
  - test only full-screen launch size

permissions:
  default:
    - edit test files
    - run build/test
    - extract xcresult
    - inspect screenshots and logs
    - open a PR of tests
  requires_approval:
    - modify production source
    - merge
    - change critic gates or baselines
